<!-- @dsCard group="Booking journey" viewport="390x844" name="Booking — mobile flow" subtitle="Date → court → slot → extras → payment → confirmation (click-through)" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prime Padel — Reservar quadra</title>
<link rel="stylesheet" href="../../../styles.css">
<link rel="stylesheet" href="booking.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Steps.jsx"></script>
<script type="text/babel">
(() => {
const { Icon, IconButton, Button, Logo, ProgressSteps, Toast } = window.PrimePadelDesignSystem_093c26;
const { DAYS, hh, fmt, calc, longDate } = window.BK;
const STEPS = ['Horário', 'Detalhes', 'Pagamento', 'Confirmação'];
const INITIAL = { day: DAYS[0].key, duration: 90, court: 'q1', period: 'noite', hour: null, players: ['', '', '', ''], addons: {}, notes: '', name: '', phone: '', email: '', pay: 'pix', terms: false };

function BookingApp() {
  const saved = (() => { try { const s = JSON.parse(window.referenceMemory.getItem('pp-booking-step')); return s && s.step < 3 ? s : null; } catch (e) { return null; } })();
  const [step, setStep] = React.useState(saved ? saved.step : 0);
  const [b, setB] = React.useState(saved ? Object.assign({}, INITIAL, saved.b) : INITIAL);
  const [errors, setErrors] = React.useState({});
  const [busy, setBusy] = React.useState(false);
  const [toast, setToast] = React.useState(false);
  const set = (patch) => setB(prev => Object.assign({}, prev, patch));
  React.useEffect(() => { window.referenceMemory.setItem('pp-booking-step', JSON.stringify({ step, b })); }, [step, b]);
  React.useEffect(() => { window.scrollTo(0, 0); }, [step]);

  const { total } = calc(b);
  const canNext = step === 0 ? b.hour != null : true;
  const ctaLabel = step === 0 ? 'Continuar' : step === 1 ? 'Ir para pagamento' : b.pay === 'arena' ? 'Confirmar reserva' : 'Pagar ' + fmt(total);

  function next() {
    if (step === 2) {
      const e = {};
      if (!b.name.trim()) e.name = 'Informe seu nome';
      if (b.phone.replace(/\D/g, '').length < 10) e.phone = 'Informe um WhatsApp válido';
      if (!b.terms) e.terms = 'Aceite a política para continuar';
      setErrors(e);
      if (Object.keys(e).length) return;
      setBusy(true);
      setTimeout(() => { setBusy(false); setStep(3); setToast(true); setTimeout(() => setToast(false), 3600); }, 900);
      return;
    }
    setStep(s => s + 1);
  }
  function back() { if (step === 0) { window.location.href = '../landing/index.html'; return; } setStep(s => s - 1); }
  function restart() { window.referenceMemory.removeItem('pp-booking-step'); }

  const meta = b.hour != null ? longDate(b.day) + ' · ' + hh(b.hour) + ' · ' + b.duration + ' min' : 'Escolha um horário';
  const cta = <Button size="lg" disabled={!canNext || busy} onClick={next} iconRight={busy ? <span className="bk-spin" /> : <Icon name="arrow-right" size={18} />}>{busy ? 'Processando' : ctaLabel}</Button>;

  return (
    <div className="bk">
      <header className="bk-top">
        <div className="bk-top__in">
          <div className="bk-top__row">
            {step < 3 ? <IconButton variant="secondary" icon={<Icon name="chevron-left" size={20} />} label="Voltar" onClick={back} /> : null}
            <div className="bk-top__title">{step < 3 ? 'Reservar quadra' : 'Reserva'}</div>
            <span className="bk-top__logo"><Logo color="green" height={34} basePath="../../" /></span>
            <IconButton variant="ghost" icon={<Icon name="message-circle" size={20} />} label="Ajuda pelo WhatsApp" />
          </div>
          {step < 3 ? <ProgressSteps steps={STEPS} current={step} /> : null}
        </div>
      </header>
      <div className="bk-layout">
        <main className="bk-main">
          {step === 0 ? <StepTime b={b} set={set} /> : null}
          {step === 1 ? <StepDetails b={b} set={set} /> : null}
          {step === 2 ? <StepPayment b={b} set={(p) => { set(p); setErrors({}); }} errors={errors} /> : null}
          {step === 3 ? <StepDone b={b} onRestart={restart} /> : null}
        </main>
        {step < 3 ? (
          <aside className="bk-aside">
            <div className="bk-block">
              <div className="bk-block__title">Resumo</div>
              <SummaryRows b={b} />
              {cta}
              <span style={{ font: '400 12px var(--font-sans)', color: 'var(--text-tertiary)', textAlign: 'center' }}>Cancelamento grátis até 24h antes</span>
            </div>
          </aside>
        ) : null}
      </div>
      {step < 3 ? (
        <div className="bk-bar">
          <div className="bk-bar__info"><div className="bk-bar__price">{b.hour != null ? fmt(total) : '—'}</div><div className="bk-bar__meta">{meta}</div></div>
          {cta}
        </div>
      ) : null}
      {toast ? <div className="bk-toast"><Toast title="Enviado para o seu WhatsApp" description="Você recebe um lembrete 2h antes do jogo." onClose={() => setToast(false)} /></div> : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<BookingApp />);
})();
</script>
</body>
</html>
