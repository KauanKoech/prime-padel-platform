<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff;font-family:var(--font-sans)}.r{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-sans)}.n{font:600 12px/1.2 var(--font-sans);margin-top:8px;color:var(--text-primary)}.h{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-tertiary);margin-top:3px}.mono{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-tertiary)}</style></head><body><div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px">
<div style="height:180px;border-radius:16px;background:var(--pp-green-700);display:flex;align-items:center;justify-content:center"><img src="../../assets/brand/prime-padel-white.png" style="height:84px"></div>
<div style="height:180px;border-radius:16px;background:var(--pp-cream);display:flex;align-items:center;justify-content:center"><img src="../../assets/brand/prime-padel-green.png" style="height:64px"></div>
<div style="height:180px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--border-default);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px"><img src="../../assets/brand/prime-padel-ink.png" style="height:44px"><span class="mono">min. 28px height</span></div></div></body></html>
