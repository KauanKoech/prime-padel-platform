<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff;font-family:var(--font-sans)}.r{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-sans)}.n{font:600 12px/1.2 var(--font-sans);margin-top:8px;color:var(--text-primary)}.h{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-tertiary);margin-top:3px}.mono{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-tertiary)}</style></head><body><div style="display:flex;align-items:center;gap:32px;background:var(--pp-green-700);border-radius:16px;padding:18px 28px;color:#fff"><div style="font:400 72px/1 var(--font-script)">Prime</div><div style="flex:1;font:400 14px/1.5 var(--font-sans);color:var(--pp-green-200)">Echoes the “Prime” wordmark. Max one script word per composition, ≥ 40px, on green or cream. Never for buttons, labels, body or data.</div></div></body></html>
