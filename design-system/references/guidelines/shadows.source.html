<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff;font-family:var(--font-sans)}.r{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-sans)}.n{font:600 12px/1.2 var(--font-sans);margin-top:8px;color:var(--text-primary)}.h{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-tertiary);margin-top:3px}.mono{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:18px;padding:12px;background:var(--pp-neutral-50);border-radius:16px"><div style="flex:1;height:110px;background:#fff;border-radius:16px;box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:12px"><span><span class="n" style="display:block">shadow-xs</span><span class="h">chips, seg thumb</span></span></div><div style="flex:1;height:110px;background:#fff;border-radius:16px;box-shadow:var(--shadow-sm);display:flex;align-items:flex-end;padding:12px"><span><span class="n" style="display:block">shadow-sm</span><span class="h">sticky bars</span></span></div><div style="flex:1;height:110px;background:#fff;border-radius:16px;box-shadow:var(--shadow-md);display:flex;align-items:flex-end;padding:12px"><span><span class="n" style="display:block">shadow-md</span><span class="h">hover cards, menus</span></span></div><div style="flex:1;height:110px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);display:flex;align-items:flex-end;padding:12px"><span><span class="n" style="display:block">shadow-lg</span><span class="h">dialogs, toasts</span></span></div></div></body></html>
