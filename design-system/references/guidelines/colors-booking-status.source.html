<!-- @dsCard group="Colors" viewport="700x150" name="Booking status" subtitle="Court/slot states used in booking grid and admin agenda" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff;font-family:var(--font-sans)}.r{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-sans)}.n{font:600 12px/1.2 var(--font-sans);margin-top:8px;color:var(--text-primary)}.h{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-tertiary);margin-top:3px}.mono{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-tertiary)}</style></head><body><div class="r" style="gap:10px"><div class="sw"><div style="height:76px;border-radius:12px;background:var(--status-available-bg);color:var(--status-available-fg);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px var(--status-available-border)"><span style="font:600 16px var(--font-sans)">18:00</span><span style="font:500 12px var(--font-sans)">Livre</span></div><div class="h">--status-available-*</div></div><div class="sw"><div style="height:76px;border-radius:12px;background:var(--status-booked-bg);color:var(--status-booked-fg);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font:600 16px var(--font-sans)">19:00</span><span style="font:500 12px var(--font-sans)">Reservado</span></div><div class="h">--status-booked-*</div></div><div class="sw"><div style="height:76px;border-radius:12px;background:var(--status-pending-bg);color:var(--status-pending-fg);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font:600 16px var(--font-sans)">20:00</span><span style="font:500 12px var(--font-sans)">Aguardando</span></div><div class="h">--status-pending-*</div></div><div class="sw"><div style="height:76px;border-radius:12px;background:var(--status-class-bg);color:var(--status-class-fg);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font:600 16px var(--font-sans)">21:00</span><span style="font:500 12px var(--font-sans)">Aula</span></div><div class="h">--status-class-*</div></div><div class="sw"><div style="height:76px;border-radius:12px;background:var(--status-blocked-bg);color:var(--status-blocked-fg);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font:600 16px var(--font-sans)">22:00</span><span style="font:500 12px var(--font-sans)">Bloqueado</span></div><div class="h">--status-blocked-*</div></div><div class="sw"><div style="height:76px;border-radius:12px;background:var(--status-cancelled-bg);color:var(--status-cancelled-fg);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font:600 16px var(--font-sans)">23:00</span><span style="font:500 12px var(--font-sans)">Cancelado</span></div><div class="h">--status-cancelled-*</div></div></div></body></html>
