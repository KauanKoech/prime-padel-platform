<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff;font-family:var(--font-sans)}.r{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-sans)}.n{font:600 12px/1.2 var(--font-sans);margin-top:8px;color:var(--text-primary)}.h{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-tertiary);margin-top:3px}.mono{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-tertiary)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;height:190px">
