<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff;font-family:var(--font-sans)}.r{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-sans)}.n{font:600 12px/1.2 var(--font-sans);margin-top:8px;color:var(--text-primary)}.h{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-tertiary);margin-top:3px}.mono{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-tertiary)}</style></head><body><div style="display:flex;align-items:flex-end;gap:10px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:2px;height:2px;background:var(--pp-green-200);border-radius:3px"></div><span class="mono">2</span><span class="mono" style="font-size:9px">s-1</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:var(--pp-green-200);border-radius:3px"></div><span class="mono">4</span><span class="mono" style="font-size:9px">s-2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:var(--pp-green-200);border-radius:3px"></div><span class="mono">8</span><span class="mono" style="font-size:9px">s-3</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--pp-green-200);border-radius:3px"></div><span class="mono">12</span><span class="mono" style="font-size:9px">s-4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:var(--pp-green-400);border-radius:3px"></div><span class="mono">16</span><span class="mono" style="font-size:9px">s-5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:20px;height:20px;background:var(--pp-green-400);border-radius:3px"></div><span class="mono">20</span><span class="mono" style="font-size:9px">s-6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:var(--pp-green-400);border-radius:3px"></div><span class="mono">24</span><span class="mono" style="font-size:9px">s-7</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--pp-green-400);border-radius:3px"></div><span class="mono">32</span><span class="mono" style="font-size:9px">s-8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:40px;background:var(--pp-green-400);border-radius:3px"></div><span class="mono">40</span><span class="mono" style="font-size:9px">s-9</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:48px;background:var(--pp-green-700);border-radius:3px"></div><span class="mono">48</span><span class="mono" style="font-size:9px">s-10</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:64px;background:var(--pp-green-700);border-radius:3px"></div><span class="mono">64</span><span class="mono" style="font-size:9px">s-11</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:80px;background:var(--pp-green-700);border-radius:3px"></div><span class="mono">80</span><span class="mono" style="font-size:9px">s-12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:96px;background:var(--pp-green-700);border-radius:3px"></div><span class="mono">96</span><span class="mono" style="font-size:9px">s-13</span></div></div></body></html>
