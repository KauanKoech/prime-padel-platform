<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:#fff;font-family:var(--font-sans)}.r{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font:600 11px/1 var(--font-sans)}.n{font:600 12px/1.2 var(--font-sans);margin-top:8px;color:var(--text-primary)}.h{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-tertiary);margin-top:3px}.mono{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-tertiary)}</style></head><body><div class="r" style="gap:12px">
<div class="sw" style="flex:1.3"><div class="chip" style="background:var(--pp-ball);color:var(--pp-ball-ink);height:100px">Ball</div><div class="n">--pp-ball</div><div class="h">#D8EC4C · dots, “ao vivo”</div></div>
<div class="sw"><div style="display:flex;flex-direction:column;height:100px;border-radius:12px;overflow:hidden"><div style="flex:1.4;background:var(--pp-success-600);color:#fff;padding:8px;font:600 11px var(--font-sans);display:flex;align-items:flex-end">Sucesso</div><div style="flex:1;background:var(--pp-success-50);color:var(--pp-success-600);padding:8px;font:600 11px var(--font-sans)">50</div></div><div class="n">--pp-success-600</div><div class="h">#2E7D4F</div></div><div class="sw"><div style="display:flex;flex-direction:column;height:100px;border-radius:12px;overflow:hidden"><div style="flex:1.4;background:var(--pp-warning-600);color:#fff;padding:8px;font:600 11px var(--font-sans);display:flex;align-items:flex-end">Atenção</div><div style="flex:1;background:var(--pp-warning-50);color:var(--pp-warning-600);padding:8px;font:600 11px var(--font-sans)">50</div></div><div class="n">--pp-warning-600</div><div class="h">#9A5F0E</div></div><div class="sw"><div style="display:flex;flex-direction:column;height:100px;border-radius:12px;overflow:hidden"><div style="flex:1.4;background:var(--pp-danger-600);color:#fff;padding:8px;font:600 11px var(--font-sans);display:flex;align-items:flex-end">Erro</div><div style="flex:1;background:var(--pp-danger-50);color:var(--pp-danger-600);padding:8px;font:600 11px var(--font-sans)">50</div></div><div class="n">--pp-danger-600</div><div class="h">#B23B2A</div></div><div class="sw"><div style="display:flex;flex-direction:column;height:100px;border-radius:12px;overflow:hidden"><div style="flex:1.4;background:var(--pp-info-600);color:#fff;padding:8px;font:600 11px var(--font-sans);display:flex;align-items:flex-end">Info</div><div style="flex:1;background:var(--pp-info-50);color:var(--pp-info-600);padding:8px;font:600 11px var(--font-sans)">50</div></div><div class="n">--pp-info-600</div><div class="h">#33617F</div></div></div></body></html>
